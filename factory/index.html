<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Software Factory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #07070f;
      color: #fff;
      font-family: -apple-system, 'SF Pro Display', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    /* Grid background */
    .grid-bg {
      background-image:
        linear-gradient(rgba(124,108,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,108,255,0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      min-height: 100vh;
    }

    /* Neon accents */
    .text-neon-purple { color: #7c6cff; }
    .text-neon-blue   { color: #00d4ff; }
    .text-neon-green  { color: #00ff88; }

    /* Cards */
    .factory-card {
      background: rgba(15,16,32,0.85);
      border: 1px solid rgba(124,108,255,0.2);
      border-radius: 14px;
      backdrop-filter: blur(12px);
    }
    .project-card {
      background: rgba(10,11,24,0.9);
      border: 1px solid rgba(0,212,255,0.15);
      border-radius: 16px;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .project-card:active {
      transform: scale(0.98);
      border-color: rgba(124,108,255,0.5);
      box-shadow: 0 4px 24px rgba(124,108,255,0.15);
    }

    /* Pipeline dot pulse */
    @keyframes pulse-dot {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:0.4; transform:scale(0.7); }
    }
    .pulse { animation: pulse-dot 1.8s ease-in-out infinite; }

    /* Progress bar fill */
    @keyframes fill-bar {
      from { width:0 }
      to   { width: var(--w) }
    }
    .bar-fill { animation: fill-bar 1.2s cubic-bezier(0.4,0,0.2,1) forwards; }

    /* Scan line */
    @keyframes scan {
      0%   { top:-4px }
      100% { top:100% }
    }
    .scan-line {
      position:absolute; left:0; right:0; height:2px;
      background: linear-gradient(90deg, transparent, #7c6cff44, transparent);
      animation: scan 3s linear infinite;
    }

    /* Flow down the pipeline */
    @keyframes flow-down {
      0%   { opacity:0; transform:translateY(-8px); }
      30%  { opacity:1; }
      70%  { opacity:1; }
      100% { opacity:0; transform:translateY(8px); }
    }
    .flow { animation: flow-down 2s ease-in-out infinite; }

    /* Fade in */
    @keyframes fade-in {
      from { opacity:0; transform:translateY(12px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .fade-in { animation: fade-in 0.4s ease forwards; }

    /* Gradient text */
    .grad-text {
      background: linear-gradient(135deg, #7c6cff, #00d4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Button */
    .btn-grad {
      background: linear-gradient(135deg, #7c6cff, #00d4ff);
      border-radius: 12px;
      color: white;
      font-weight: 700;
      transition: opacity 0.15s;
    }
    .btn-grad:active { opacity: 0.8; }
    .btn-line-green {
      background: linear-gradient(135deg, #00b900, #00d900);
      border-radius: 12px;
      color: white;
      font-weight: 700;
    }

    /* Tab active */
    .tab-active { border-bottom: 2px solid #7c6cff; }
    .tab-active span { color: #7c6cff; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #7c6cff55; border-radius: 2px; }

    /* Loading spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.8s linear infinite; }

    /* Blinking cursor */
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .cursor::after { content:'|'; animation: blink 1s step-end infinite; }
  </style>
</head>
<body class="grid-bg">

<!-- ── HEADER ─────────────────────────────────────── -->
<div id="header" class="fixed top-0 left-0 right-0 z-50 px-4 py-3"

  <!-- ===== DETAIL VIEW ===== -->

<!-- ── BOTTOM NAV ──────────────────────────────────── -->
<div class="fixed bottom-0 left-0 right-0 z-50 flex"
     style="background:rgba(7,7,15,0.97); border-top:1px solid rgba(124,108,255,0.12); padding-bottom:env(safe-area-inset-bottom);">

    <span class="text-xl">🏭</span>

  <button onclick="showView('products')" id="nav-products" class="flex-1 py-3 flex flex-col items-center gap-0.5 active:opacity-60">

  <button onclick="showView('status')" id="nav-status" class="flex-1 py-3 flex flex-col items-center gap-0.5 active:opacity-60">
    <span class="text-xl">📡</span>

  </button>
  <button onclick="showView('history')" id="nav-history" class="flex-1 py-3 flex flex-col items-center gap-0.5 active:opacity-60">
    <span class="text-xl">📋</span>
    <span class="text-xs text-gray-600">紀錄</span>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────
const LIFF_ID    = 'REPLACE_WITH_LIFF_ID';   // ← 需要在 LINE Developers 建立後填入
const PM_CENTER  = 'https://ai-pm-center-827577239332.asia-east1.run.app';
const GH_PAGES   = 'https://a0913719875-commits.github.io/ai-company-projects';

// ── STATE ────────────────────────────────────────────────────────────
let currentUser  = null;
let projects     = [];
let liffReady    = false;

// ── PIPELINE DATA ────────────────────────────────────────────────────
const PIPELINE = [
  { icon:'🧠', name:'CEO AI',        color:'#7c6cff', delay:0   },
  { icon:'📋', name:'ProductAI',     color:'#a78bfa', delay:0.3 },
  { icon:'🏗️', name:'ArchitectAI',   color:'#60a5fa', delay:0.6 },
  { icon:'🎨', name:'FrontendAI',    color:'#00d4ff', delay:0.9 },
  { icon:'💻', name:'BackendAI',     color:'#06b6d4', delay:1.2 },
  { icon:'🗄️', name:'DataAI',        color:'#34d399', delay:1.5 },
  { icon:'🔍', name:'QA AI',         color:'#00ff88', delay:1.8 },
  { icon:'🔒', name:'SecurityAI',    color:'#fbbf24', delay:2.1 },
  { icon:'🚀', name:'DevOps AI',     color:'#f97316', delay:2.4 },
];

const DEPT_STATUS = [
  { icon:'🧠', name:'CEO AI',       status:'就緒' },
  { icon:'🏗️', name:'ArchitectAI',  status:'就緒' },
  { icon:'🎨', name:'FrontendAI',   status:'就緒' },
  { icon:'💻', name:'BackendAI',    status:'就緒' },
  { icon:'🔍', name:'QA AI',        status:'就緒' },
  { icon:'🔒', name:'SecurityAI',   status:'就緒' },
  { icon:'🚀', name:'DevOps AI',    status:'就緒' },
  { icon:'📊', name:'AnalyticsAI',  status:'就緒' },
];

// ── STAGE CONFIG ─────────────────────────────────────────────────────
const STAGES = [
  { name:'需求分析', icon:'📋' },
  { name:'系統架構', icon:'🏗️' },
  { name:'UI 設計',  icon:'🎨' },
  { name:'前端開發', icon:'⚛️' },
  { name:'後端開發', icon:'💻' },
  { name:'測試',     icon:'🔍' },
  { name:'部署',     icon:'🚀' },
];

const STATUS_PROGRESS = {
  planning:    { pct: 15, stage: 0, label: '需求規劃中' },
  ui_design:   { pct: 40, stage: 2, label: 'UI 設計中'  },
  development: { pct: 65, stage: 4, label: '開發中'      },
  qa:          { pct: 85, stage: 5, label: '測試中'      },
  completed:   { pct:100, stage: 7, label: '已完成'      },
};

// ── DJB2 HASH ────────────────────────────────────────────────────────
function djb2(str) {
  let h = 5381;
  for (const c of str) h = ((h * 33) ^ c.charCodeAt(0)) >>> 0;
  return 'c_' + h.toString(16).padStart(8, '0');
}

// ── VIEW NAVIGATION ──────────────────────────────────────────────────
function showView(name) {
  document.querySelectorAll('[id^="view-"]').forEach(el => {
    el.classList.add('hidden');
    el.classList.remove('fade-in');
  });
  const el = document.getElementById('view-' + name);
  if (!el) return;
  el.classList.remove('hidden');
  void el.offsetWidth; // reflow
  el.classList.add('fade-in');
  window.scrollTo({ top: 0 });

  // Update bottom nav highlight
  ['home','products','status','history'].forEach(v => {
    const btn = document.getElementById('nav-' + v);
    if (!btn) return;
    const span = btn.querySelector('span:last-child');
    if (v === name) { span.style.color = '#7c6cff'; }
    else            { span.style.color = ''; }
  });

  if (name === 'status')  renderStatus();
  if (name === 'history') renderHistory();
}

// ── PIPELINE RENDER ──────────────────────────────────────────────────
function renderPipeline() {
  const el = document.getElementById('pipeline-steps');
  el.innerHTML = PIPELINE.map((d, i) => `
    <div class="flex items-center gap-3">
      <div class="pulse w-2 h-2 rounded-full flex-shrink-0"
           style="background:${d.color}; animation-delay:${d.delay}s;"></div>
      <span class="text-sm flex-1">${d.icon} ${d.name}</span>
      <span class="text-xs px-2 py-0.5 rounded-full"
            style="background:rgba(0,255,136,0.08); color:#00ff88; border:1px solid rgba(0,255,136,0.15);">
        ✅ 就緒
      </span>
    </div>
    ${i < PIPELINE.length - 1 ? '<div class="ml-1 text-gray-800 text-xs">│</div>' : ''}
  `).join('');
}

// ── DEPT STATUS RENDER ───────────────────────────────────────────────
function renderDeptGrid() {
  const el = document.getElementById('dept-grid');
  el.innerHTML = DEPT_STATUS.map(d => `
    <div class="flex items-center gap-2 p-2 rounded-lg"
         style="background:rgba(0,255,136,0.04); border:1px solid rgba(0,255,136,0.1);">
      <span>${d.icon}</span>
      <div class="flex-1 min-w-0">
        <div class="text-xs font-bold truncate">${d.name}</div>
        <div class="text-xs text-neon-green">● ${d.status}</div>
      </div>
    </div>
  `).join('');
}

// ── STATUS VIEW ──────────────────────────────────────────────────────
function renderStatus() {
  renderDeptGrid();
  const active = projects.filter(p => p.status && p.status !== 'completed');
  const el = document.getElementById('active-pipeline');

  if (active.length === 0) {
    el.innerHTML = `
      <div class="factory-card p-5 mb-4 text-center text-gray-600">
        <div class="text-3xl mb-2">⚡</div>
        <p class="text-sm">目前無進行中專案</p>
        <p class="text-xs mt-1">透過 AI CEO 開始新專案</p>
      </div>`;
    return;
  }

  el.innerHTML = active.map(p => {
    const sp = STATUS_PROGRESS[p.status] || STATUS_PROGRESS.planning;
    const name = (p.requirement || p.project_id || '未命名').substring(0, 22);
    const depts = [
      { name:'CEO AI',       pct: sp.stage >= 0 ? 100 : 0, done: true  },
      { name:'ArchitectAI',  pct: sp.stage >= 1 ?  100 : 0, done: sp.stage >= 1 },
      { name:'FrontendAI',   pct: sp.stage >= 3 ? (sp.stage === 3 ? 60 : 100) : 0, done: sp.stage >= 4 },
      { name:'BackendAI',    pct: sp.stage >= 4 ? (sp.stage === 4 ? 50 : 100) : 0, done: sp.stage >= 5 },
      { name:'QA AI',        pct: sp.stage >= 5 ? 60 : 0, done: sp.stage >= 6 },
      { name:'Deploy AI',    pct: sp.stage >= 6 ? 100 : 0, done: sp.stage >= 7 },
    ];

    return `
      <div class="factory-card p-4 mb-4 relative overflow-hidden">
        <div class="scan-line"></div>
        <div class="flex justify-between mb-3">
          <div>
            <div class="text-xs text-neon-green mb-0.5">⚡ 運作中</div>
            <div class="font-bold">${name}</div>
          </div>
          <div class="text-right">
            <div class="text-3xl font-black text-neon-purple">${sp.pct}%</div>
            <div class="text-xs text-gray-600">${sp.label}</div>
          </div>
        </div>
        ${depts.map(d => `
          <div class="flex items-center gap-2 mb-2">
            <div class="text-xs w-20 text-gray-500 truncate">${d.name}</div>
            <div class="flex-1 h-1.5 rounded-full" style="background:rgba(255,255,255,0.05);">
              <div class="h-1.5 rounded-full bar-fill"
                   style="--w:${d.pct}%; background:${d.done ? '#00ff88' : 'linear-gradient(90deg,#7c6cff,#00d4ff)'};"></div>
            </div>
            <div class="text-xs w-8 text-right" style="color:${d.done?'#00ff88':'#7c6cff'}">
              ${d.pct > 0 ? d.pct + '%' : '—'}
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }).join('');
}

// ── PROJECT CARDS ────────────────────────────────────────────────────
function renderProjects() {
  const el = document.getElementById('project-cards');
  document.getElementById('products-loading').classList.add('hidden');
  el.classList.remove('hidden');

  const done = projects.filter(p => p.status === 'completed').length;
  document.getElementById('stat-done').textContent = done;

  if (projects.length === 0) {
    el.innerHTML = `
      <div class="factory-card p-7 text-center text-gray-600">
        <div class="text-4xl mb-3">🚀</div>
        <p class="font-bold mb-1">尚無專案</p>
        <p class="text-xs">透過 LINE 與 AI CEO 對談開始第一個專案</p>
      </div>`;
    return;
  }

  el.innerHTML = projects.map((p, i) => {
    const sp    = STATUS_PROGRESS[p.status] || STATUS_PROGRESS.planning;
    const name  = (p.requirement || p.project_id || '未命名').substring(0, 20);
    const clr   = p.status === 'completed' ? '#00ff88' : '#7c6cff';
    const since = p.created_at ? new Date(p.created_at).toLocaleDateString('zh-TW') : '';

    return `
      <div class="project-card p-4 mb-3 cursor-pointer" onclick="showDetail(${i})">
        <div class="flex items-start justify-between mb-3">
          <div class="flex-1 min-w-0">
            <div class="font-bold text-white truncate">${name}</div>
            <div class="text-xs mt-0.5" style="color:${clr};">● ${sp.label}</div>
          </div>
          <div class="text-right ml-3 flex-shrink-0">
            <div class="text-3xl font-black" style="color:#7c6cff;">${sp.pct}%</div>
            ${since ? `<div class="text-xs text-gray-700">${since}</div>` : ''}
          </div>
        </div>

        <!-- Progress bar -->
        <div class="h-2 rounded-full mb-2" style="background:rgba(124,108,255,0.1);">
          <div class="h-2 rounded-full bar-fill"
               style="--w:${sp.pct}%; background:linear-gradient(90deg,#7c6cff,#00d4ff);"></div>
        </div>

        <div class="flex items-center justify-between">
          <div class="text-xs text-gray-700">${sp.label}</div>
          ${p.deploy_url ? `
          <a href="${p.deploy_url}" target="_blank" onclick="event.stopPropagation()"
             class="text-xs text-neon-blue">🌐 查看 →</a>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

// ── PROJECT DETAIL ───────────────────────────────────────────────────
function showDetail(index) {
  const p  = projects[index];
  if (!p) return;
  const sp = STATUS_PROGRESS[p.status] || STATUS_PROGRESS.planning;
  const name = (p.requirement || p.project_id || '未命名').substring(0, 30);

  document.getElementById('detail-name').textContent = name;

  const stagesHtml = STAGES.map((s, i) => {
    const done    = i < sp.stage;
    const active  = i === sp.stage;
    const pct     = done ? 100 : (active ? sp.pct % 20 * 5 : 0);
    const filled  = Math.round(pct / 10);
    const bar     = '█'.repeat(filled) + '░'.repeat(10 - filled);
    const color   = done ? '#00ff88' : (active ? '#7c6cff' : '#1a1a2e');
    const badge   = done ? '✅' : (active ? '⚡' : '—');

    return `
      <div class="flex items-center gap-3 mb-4">
        <span class="text-xl w-8">${s.icon}</span>
        <div class="flex-1">
          <div class="flex justify-between mb-1">
            <span class="text-sm font-medium">${s.name}</span>
            <span class="text-xs" style="color:${color}">${badge}</span>
          </div>
          <div class="font-mono text-xs tracking-widest" style="color:${color};">${bar}</div>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('detail-content').innerHTML = `
    <!-- Big progress ring -->
    <div class="factory-card p-5 text-center mb-3">
      <div class="inline-flex items-center justify-center w-24 h-24 rounded-full mb-2"
           style="background: conic-gradient(#7c6cff ${sp.pct * 3.6}deg, rgba(124,108,255,0.1) 0deg);">
        <div class="w-20 h-20 rounded-full flex flex-col items-center justify-center"
             style="background:#07070f;">
          <div class="text-2xl font-black text-neon-purple">${sp.pct}%</div>
          <div class="text-xs text-gray-600">完成</div>
        </div>
      </div>
      <div class="font-bold">${name}</div>
      <div class="text-xs text-gray-600 mt-0.5">${sp.label}</div>
    </div>

    <!-- Stage breakdown -->
    <div class="factory-card p-4 mb-3">
      <div class="text-xs text-gray-600 mb-3 tracking-widest">📊 開發階段</div>
      ${stagesHtml}
    </div>

    <!-- Metadata -->
    <div class="factory-card p-4 mb-3">
      <div class="text-xs text-gray-600 mb-2">專案資訊</div>
      <div class="text-xs text-gray-400 font-mono">${p.project_id || '-'}</div>
      ${p.created_at ? `<div class="text-xs text-gray-700 mt-1">建立：${new Date(p.created_at).toLocaleString('zh-TW')}</div>` : ''}
    </div>

    ${p.deploy_url ? `
    <a href="${p.deploy_url}" target="_blank"
       class="btn-grad block w-full py-4 text-center text-base font-black mb-3">
      🌐 查看作品
    </a>` : ''}
  `;

  showView('detail');
}

    return `
      <div class="factory-card p-4 mb-3 flex items-center gap-3">

        </div>

          查看 →
        </a>` : ''}
      </div>
    `;
  }).join('');
}

// ── LIFF & AUTH ──────────────────────────────────────────────────────
function handleUserBtn() {
  if (!currentUser) {
    showView('products');
  }
}

async function doLiffLogin() {
  if (!liffReady) {
    // Demo mode fallback
    demoMode();
    return;
  }
  if (!liff.isLoggedIn()) {
    liff.login({ redirectUri: window.location.href });
  } else {
    await afterLogin();
  }
}

async function afterLogin() {
  try {
    const profile = await liff.getProfile();
    currentUser = profile;

    // Update header avatar
    document.getElementById('user-icon').outerHTML =
      `<img src="${profile.pictureUrl}" class="w-9 h-9 rounded-full object-cover" id="user-icon">`;

    // Update products section
    document.getElementById('user-pic').src = profile.pictureUrl;
    document.getElementById('user-display-name').textContent = profile.displayName;
    const cid = djb2(profile.userId);
    document.getElementById('user-cid').textContent = cid;

    document.getElementById('login-prompt').classList.add('hidden');
    document.getElementById('products-logged-in').classList.remove('hidden');

    await loadProjects(profile.userId, cid);
  } catch (e) {
    console.error(e);
    demoMode();
  }
}

async function loadProjects(userId, customerId) {
  try {
    const res = await fetch(`${PM_CENTER}/projects/${userId}`, { signal: AbortSignal.timeout(6000) });
    if (!res.ok) throw new Error('API error');
    const data = await res.json();
    projects = Array.isArray(data) ? data : (data.projects || []);
  } catch (e) {
    console.warn('PM Center fallback:', e.message);
    projects = getDemoData();
  }
  renderProjects();
}

function demoMode() {
  currentUser = { displayName: '示範用戶', pictureUrl: '', userId: 'demo' };
  document.getElementById('user-display-name').textContent = '示範用戶';
  document.getElementById('user-cid').textContent = 'c_demo0001';
  document.getElementById('login-prompt').classList.add('hidden');
  document.getElementById('products-logged-in').classList.remove('hidden');
  projects = getDemoData();
  renderProjects();
}

async function init() {
  renderPipeline();
  showView('home');

  // Init LIFF
  try {
    await liff.init({ liffId: LIFF_ID });
    liffReady = true;
    if (liff.isLoggedIn()) {
