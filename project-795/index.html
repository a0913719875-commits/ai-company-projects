<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客戶資料建檔</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #fefce8; }
        .card { background-color: #ffffff; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); border-radius: 16px; }
        .btn { transition: all 0.2s cubic-bezier(0.4,0,0.2,1); }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2); }
        .btn:active { transform: scale(0.97); }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2); }
        .input:focus { border-color: #f59e0b; box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.25); }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="p-6 sm:p-10 fade-in">
    <header class="mb-12">
        <div class="flex justify-between items-center">
            <h1 class="text-3xl font-extrabold text-amber-800">客戶資料建檔</h1>
            <button id="addCustomerBtn" class="btn px-6 py-2 text-white bg-amber-500 rounded-full">新增客戶</button>
        </div>
        <p class="mt-3 text-gray-700">記錄客戶生日及基本資料，並傳送生日及節日慶祝文。</p>
    </header>

    <main>
        <section id="customerList" class="space-y-6">
            <div id="emptyState" class="text-center text-gray-500">
                <p class="text-lg">目前沒有客戶資料</p>
            </div>
        </section>
    </main>

    <!-- 顧客資料表單模態框 -->
    <div id="customerFormModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="card p-8 space-y-4 w-full max-w-md">
            <h2 class="text-xl font-bold text-gray-800">新增客戶</h2>
            <form id="customerForm">
                <input type="text" id="name" class="input w-full px-4 py-2 border rounded-lg" placeholder="客戶姓名" required>
                <input type="date" id="dob" class="input w-full px-4 py-2 border rounded-lg" required>
                <div class="flex justify-end space-x-4 mt-4">
                    <button type="button" id="cancelBtn" class="btn px-4 py-2 text-gray-700 border rounded-full">取消</button>
                    <button type="submit" class="btn px-4 py-2 text-white bg-amber-500 rounded-full">儲存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // localStorage key
        const STORAGE_KEY = 'customerData';

        // DOM elements
        const customerList = document.getElementById('customerList');
        const emptyState = document.getElementById('emptyState');
        const customerFormModal = document.getElementById('customerFormModal');
        const addCustomerBtn = document.getElementById('addCustomerBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const customerForm = document.getElementById('customerForm');

        // Event Listeners
        addCustomerBtn.addEventListener('click', () => customerFormModal.classList.remove('hidden'));
        cancelBtn.addEventListener('click', () => customerFormModal.classList.add('hidden'));
        customerForm.addEventListener('submit', saveCustomer);

        // Functions
        function loadCustomers() {
            const customers = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            if (customers.length) {
                emptyState.classList.add('hidden');
                customers.forEach(customer => displayCustomer(customer));
            }
        }

        function displayCustomer({ id, name, dob }) {
            const customerCard = document.createElement('div');
            customerCard.className = 'card p-4';
            customerCard.innerHTML = `
                <div class="flex justify-between items-center">
                    <div>
                        <div class="text-lg font-bold">${name}</div>
                        <div class="text-sm text-gray-600">${dob}</div>
                    </div>
                    <button onclick="deleteCustomer(${id})" class="btn px-3 py-1.5 text-white bg-red-500 rounded-full">刪除</button>
                </div>
            `;
            customerList.appendChild(customerCard);
        }

        function saveCustomer(e) {
            e.preventDefault();
            const customers = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            const newCustomer = {
                id: Date.now(),
                name: customerForm.name.value,
                dob: customerForm.dob.value,
                created: new Date().toISOString(),
                updated: new Date().toISOString()
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify([...customers, newCustomer]));
            customerFormModal.classList.add('hidden');
            displayCustomer(newCustomer);
            if (!customers.length) emptyState.classList.add('hidden');
            customerForm.reset();
        }

        function deleteCustomer(id) {
            const confirmation = confirm('確定要刪除此客戶資料嗎？');
            if (!confirmation) return;
            const customers = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            const filteredCustomers = customers.filter(customer => customer.id !== id);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(filteredCustomers));
            document.location.reload();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadCustomers);
    </script>
</body>
</html>
