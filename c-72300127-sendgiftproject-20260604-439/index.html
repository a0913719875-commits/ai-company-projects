<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>禮物管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #07070f; color: #ffffff; min-height: 100vh; }
    .card { background: #0f1020; border: 1px solid #1a1d35; border-radius: 14px; }
    .btn-primary { background: linear-gradient(135deg, #7c6cff, #a3a1ff); color: white; border: none; border-radius: 10px; padding: 10px 20px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-secondary { background: transparent; color: #7c6cff; border: 1px solid #7c6cff33; border-radius: 10px; padding: 8px 16px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .btn-secondary:hover { background: #7c6cff11; }
    .btn-danger { background: #dc262622; color: #dc2626; border: 1px solid #dc262633; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .btn-danger:hover { background: #dc262633; }
    .input { background: #0f1020; border: 1px solid #1a1d35; border-radius: 10px; padding: 10px 14px; color: #ffffff; width: 100%; font-size: 14px; transition: border 0.2s; outline: none; }
    .input:focus { border-color: #7c6cff; box-shadow: 0 0 0 3px #7c6cff22; }
    .select { background: #0f1020; border: 1px solid #1a1d35; border-radius: 10px; padding: 10px 14px; color: #ffffff; font-size: 14px; cursor: pointer; outline: none; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .table-row { border-bottom: 1px solid #1a1d35; transition: background 0.15s; }
    .table-row:hover { background: #7c6cff08; }
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: #00000088; display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
    .modal-box { background: #0f1020; border-radius: 18px; width: 100%; max-width: 480px; padding: 28px; border: 1px solid #1a1d35; }
    /* Toast */
    .toast { position: fixed; bottom: 24px; right: 24px; background: #1a1a2e; border: 1px solid #7c6cff44; border-radius: 12px; padding: 14px 20px; color: white; font-size: 14px; font-weight: 500; z-index: 100; transform: translateY(100px); transition: transform 0.3s ease; }
    .toast.show { transform: translateY(0); }
    .toast.success { border-left: 3px solid #00ff88; }
    .toast.error { border-left: 3px solid #ff4466; }
    /* Empty state */
    .empty-state { text-align: center; padding: 60px 20px; color: #666; }
    /* Stat card */
    .stat-card { text-align: center; }
    .stat-value { font-size: 28px; font-weight: 800; color: #7c6cff; }
    .stat-label { font-size: 12px; color: #888; margin-top: 4px; }
    /* Search */
    .search-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    /* Confirm dialog */
    .confirm-overlay { position: fixed; inset: 0; background: #00000088; display: flex; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
    .confirm-box { background: #0f1020; border-radius: 16px; width: 100%; max-width: 340px; padding: 24px; border: 1px solid #1a1d35; text-align: center; }
  </style>
</head>
<body class="p-4 md:p-8">

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Confirm Dialog -->
<div id="confirmOverlay" class="confirm-overlay hidden">
  <div class="confirm-box">
    <div class="text-lg font-bold mb-2" id="confirmTitle">確認刪除</div>
    <div class="text-sm text-gray-400 mb-6" id="confirmMsg">此操作無法復原，確定要刪除嗎？</div>
    <div class="flex gap-3 justify-center">
      <button class="btn-secondary" onclick="closeConfirm()">取消</button>
      <button class="btn-danger" id="confirmOkBtn" style="padding:8px 20px;">確定刪除</button>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold" id="modalTitle">新增禮物</h2>
      <button onclick="closeModal()" style="background:none;border:none;color:#888;font-size:22px;cursor:pointer;">✕</button>
    </div>
    <form id="dataForm" onsubmit="saveRecord(event)">
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1" for="f_name">禮物名稱</label>
        <input class="input" type="text" id="f_name" required>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1" for="f_recipient">收禮人</label>
        <input class="input" type="text" id="f_recipient" required>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1" for="f_date">送禮日期</label>
        <input class="input" type="date" id="f_date" required>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1" for="f_occassion">送禮場合</label>
        <input class="input" type="text" id="f_occassion">
      </div>
      <div class="flex gap-3 mt-6">
        <button type="button" class="btn-secondary flex-1" onclick="closeModal()">取消</button>
        <button type="submit" class="btn-primary flex-1" id="saveBtn">儲存</button>
      </div>
    </form>
  </div>
</div>

<!-- Header -->
<div class="flex flex-wrap gap-3 items-center justify-between mb-8">
  <div>
    <h1 class="text-3xl font-black">禮物管理系統</h1>
    <p class="text-gray-500 text-sm mt-1">掌控您的送禮紀錄</p>
  </div>
  <div class="flex gap-2">
    <button class="btn-secondary" onclick="exportCSV()">📥 匯出 CSV</button>
    <button class="btn-primary" onclick="openAddModal()">＋ 新增禮物</button>
  </div>
</div>

<!-- Stats Row -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
  <div class="card p-4 stat-card">
    <div class="stat-value" id="statTotalGifts">0</div>
    <div class="stat-label">總禮物數量</div>
  </div>
  <div class="card p-4 stat-card">
    <div class="stat-value" id="statUniqueRecipients">0</div>
    <div class="stat-label">收禮人數量</div>
  </div>
</div>

<!-- Search & Filter -->
<div class="card p-4 mb-6">
  <div class="search-row">
    <input class="input" style="flex:1;min-width:180px;" id="searchInput" placeholder="🔍 搜尋..." oninput="filterData()">
    <button class="btn-secondary" onclick="clearFilters()">清除篩選</button>
  </div>
</div>

<!-- Data Table -->
<div class="card overflow-hidden">
  <div class="overflow-x-auto">
    <table style="width:100%;border-collapse:collapse;">
      <thead>
        <tr style="border-bottom:1px solid #1a1d35;">
          <th style="padding:14px 16px;text-align:left;font-weight:600;font-size:13px;color:#888;">禮物名稱</th>
          <th style="padding:14px 16px;text-align:left;font-weight:600;font-size:13px;color:#888;">收禮人</th>
          <th style="padding:14px 16px;text-align:left;font-weight:600;font-size:13px;color:#888;">送禮日期</th>
          <th style="padding:14px 16px;text-align:left;font-weight:600;font-size:13px;color:#888;">送禮場合</th>
          <th style="padding:14px 16px;text-align:right;font-weight:600;font-size:13px;color:#888;">操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="emptyState" class="empty-state hidden">
      <div style="font-size:48px;margin-bottom:12px;">📭</div>
      <div class="font-bold text-lg">暫無資料</div>
      <div class="text-sm mt-2">點擊右上角「新增」開始使用</div>
    </div>
  </div>
  <div class="p-4 flex justify-between items-center" style="border-top:1px solid #1a1d35;">
    <div class="text-sm text-gray-500" id="countInfo">共 0 筆</div>
    <div class="flex gap-2" id="pagination"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════
// 資料定義
// ════════════════════════════════════════════════════
const APP_CONFIG = {
  storageKey: 'giftsData',
  itemName: '禮物',
  fields: [
    { name: 'name', label: '禮物名稱', type: 'text', required: true },
    { name: 'recipient', label: '收禮人', type: 'text', required: true },
    { name: 'date', label: '送禮日期', type: 'date', required: true },
    { name: 'occassion', label: '送禮場合', type: 'text', required: false }
  ],
  stats: [
    { id: 'statTotalGifts', label: '總禮物數量', compute: data => data.length },
    { id: 'statUniqueRecipients', label: '收禮人數量', compute: data => [...new Set(data.map(item => item.recipient))].length }
  ],
  sampleData: [
    { name: '生日蛋糕', recipient: '小明', date: '2023-01-15', occassion: '生日' },
    { name: '巧克力禮盒', recipient: '小華', date: '2023-02-14', occassion: '情人節' },
    { name: '葡萄酒', recipient: '小美', date: '2023-05-01', occassion: '勞動節' },
    { name: '花束', recipient: '小美', date: '2023-08-08', occassion: '七夕' },
    { name: '書籍', recipient: '小明', date: '2023-12-25', occassion: '聖誕節' }
  ]
};

// ════════════════════════════════════════════════════
// 核心引擎
// ════════════════════════════════════════════════════
let records = [];
let editId = null;
let confirmCallback = null;
let currentPage = 1;
const PAGE_SIZE = 15;

function load() {
  const stored = localStorage.getItem(APP_CONFIG.storageKey);
  records = stored ? JSON.parse(stored) : [];
  if (records.length === 0 && APP_CONFIG.sampleData.length > 0) {
    records = APP_CONFIG.sampleData.map((d, i) => ({...d, id: Date.now() + i, createdAt: new Date().toISOString()}));
    save();
  }
  render();
}

function save() {
  localStorage.setItem(APP_CONFIG.storageKey, JSON.stringify(records));
  updateStats();
}

function getFiltered() {
  const q = document.getElementById('searchInput')?.value.toLowerCase() || '';
  let result = records;
  if (q) {
    result = result.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(q)));
  }
  return result;
}

function render() {
  const data = getFiltered();
  const tableBody = document.getElementById('tableBody');
  const emptyState = document.getElementById('emptyState');
  const countInfo = document.getElementById('countInfo');

  // Reset table
  tableBody.innerHTML = '';
  emptyState.classList.toggle('hidden', data.length > 0);

  if (data.length > 0) {
    data.forEach((record, index) => {
      const tr = document.createElement('tr');
      tr.classList.add('table-row');
      tr.innerHTML = renderRow(record, index);
      tableBody.appendChild(tr);
    });
  }
  countInfo.textContent = `共 ${data.length} 筆`;
  updateStats();
}

function renderRow(record, index) {
  return `
    <td style="padding:14px 16px;">${record.name}</td>
    <td style="padding:14px 16px;">${record.recipient}</td>
    <td style="padding:14px 16px;">${record.date}</td>
    <td style="padding:14px 16px;">${record.occassion || '-'}</td>
    <td style="padding:14px 16px;text-align:right;">
      <button class="btn-secondary" onclick="editRecord(${record.id})">編輯</button>
      <button class="btn-danger" onclick="confirmDelete(${record.id})">刪除</button>
    </td>
  `;
}

function openAddModal() {
  editId = null;
  document.getElementById('dataForm').reset();
  document.getElementById('modalTitle').textContent = '新增禮物';
  openModal();
}

function editRecord(id) {
  const record = records.find(r => r.id === id);
  if (record) {
    editId = id;
    document.getElementById('f_name').value = record.name;
    document.getElementById('f_recipient').value = record.recipient;
    document.getElementById('f_date').value = record.date;
    document.getElementById('f_occassion').value = record.occassion;
    document.getElementById('modalTitle').textContent = '編輯禮物';
    openModal();
  }
}

function openModal() {
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
}

function saveRecord(event) {
  event.preventDefault();

  const name = document.getElementById('f_name').value.trim();
  const recipient = document.getElementById('f_recipient').value.trim();
  const date = document.getElementById('f_date').value;
  const occassion = document.getElementById('f_occassion').value.trim();

  if (!name || !recipient || !date) {
    showToast('表單驗證失敗，請檢查輸入資料', false);
    return;
  }

  const record = { id: editId || Date.now(), name, recipient, date, occassion, createdAt: new Date().toISOString() };

  if (editId) {
    const index = records.findIndex(r => r.id === editId);
    records[index] = record;
    showToast('禮物已更新', true);
  } else {
    records.push(record);
    showToast('禮物已新增', true);
  }

  save();
  closeModal();
  render();
}

function confirmDelete(id) {
  confirmCallback = () => deleteRecord(id);
  document.getElementById('confirmOverlay').classList.remove('hidden');
}

function deleteRecord(id) {
  records = records.filter(r => r.id !== id);
  save();
  render();
  closeConfirm();
  showToast('禮物已刪除', true);
}

function closeConfirm() {
  document.getElementById('confirmOverlay').classList.add('hidden');
}

function showToast(message, success = true) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.toggle('success', success);
  toast.classList.toggle('error', !success);
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function clearFilters() {
  document.getElementById('searchInput').value = '';
  render();
}

function exportCSV() {
  const csvData = records.map(record => ({
    '禮物名稱': record.name,
    '收禮人': record.recipient,
    '送禮日期': record.date,
    '送禮場合': record.occassion
  }));

  const csvContent = 'data:text/csv;charset=utf-8,' 
    + Object.keys(csvData[0]).join(',') + '\n'
    + csvData.map(e => Object.values(e).join(',')).join('\n');
  
  const encodedUri = encodeURI(csvContent);
  const link = document.createElement('a');
  link.setAttribute('href', encodedUri);
  link.setAttribute('download', 'gifts.csv');
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function updateStats() {
  APP_CONFIG.stats.forEach(stat => {
    const element = document.getElementById(stat.id);
    const value = stat.compute(records);
    element.textContent = value;
  });
}

window.onload = load;
</script>
</body>
</html>
