<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>送禮管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #07070f; color: #ffffff; min-height: 100vh; }
    .card { background: #0f1020; border: 1px solid #1a1d35; border-radius: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .btn-primary { background: linear-gradient(135deg, #7c6cff, #4b46a8); color: white; border: none; border-radius: 10px; padding: 10px 20px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-secondary { background: transparent; color: #7c6cff; border: 1px solid #7c6cff33; border-radius: 10px; padding: 8px 16px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .btn-secondary:hover { background: #7c6cff11; }
    .btn-danger { background: #dc262622; color: #dc2626; border: 1px solid #dc262633; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .btn-danger:hover { background: #dc262633; }
    .input, .select { background: #0f1020; border: 1px solid #1a1d35; border-radius: 10px; padding: 10px 14px; color: #ffffff; width: 100%; font-size: 14px; transition: border 0.2s; outline: none; }
    .input:focus, .select:focus { border-color: #7c6cff; box-shadow: 0 0 0 3px #7c6cff22; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .table-row { border-bottom: 1px solid #1a1d35; transition: background 0.15s; }
    .table-row:hover { background: #7c6cff08; }
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: #00000088; display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
    .modal-box { background: #0f1020; border-radius: 18px; width: 100%; max-width: 480px; padding: 28px; border: 1px solid #1a1d35; }
    /* Toast */
    .toast { position: fixed; bottom: 24px; right: 24px; background: #1a1a2e; border: 1px solid #7c6cff44; border-radius: 12px; padding: 14px 20px; color: white; font-size: 14px; font-weight: 500; z-index: 100; transform: translateY(100px); transition: transform 0.3s ease; }
    .toast.show { transform: translateY(0); }
    .toast.success { border-left: 3px solid #00ff88; }
    .toast.error { border-left: 3px solid #ff4466; }
    /* Empty state */
    .empty-state { text-align: center; padding: 60px 20px; color: #666; }
    /* Stat card */
    .stat-card { text-align: center; }
    .stat-value { font-size: 28px; font-weight: 800; color: #7c6cff; }
    .stat-label { font-size: 12px; color: #888; margin-top: 4px; }
    /* Search */
    .search-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    /* Confirm dialog */
    .confirm-overlay { position: fixed; inset: 0; background: #00000088; display: flex; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
    .confirm-box { background: #0f1020; border-radius: 16px; width: 100%; max-width: 340px; padding: 24px; border: 1px solid #1a1d35; text-align: center; }
  </style>
</head>
<body class="p-4 md:p-8">

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Confirm Dialog -->
<div id="confirmOverlay" class="confirm-overlay hidden">
  <div class="confirm-box">
    <div class="text-lg font-bold mb-2" id="confirmTitle">確認刪除</div>
    <div class="text-sm text-gray-400 mb-6" id="confirmMsg">此操作無法復原，確定要刪除嗎？</div>
    <div class="flex gap-3 justify-center">
      <button class="btn-secondary" onclick="closeConfirm()">取消</button>
      <button class="btn-danger" id="confirmOkBtn" style="padding:8px 20px;">確定刪除</button>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold" id="modalTitle">新增資料</h2>
      <button onclick="closeModal()" style="background:none;border:none;color:#888;font-size:22px;cursor:pointer;">✕</button>
    </div>
    <form id="dataForm" onsubmit="saveRecord(event)">
      <div class="mb-4">
        <label for="f_recipient" class="text-sm mb-2 inline-block">收件人</label>
        <input type="text" id="f_recipient" class="input" required>
      </div>
      <div class="mb-4">
        <label for="f_gift" class="text-sm mb-2 inline-block">禮物</label>
        <input type="text" id="f_gift" class="input" required>
      </div>
      <div class="mb-4">
        <label for="f_date" class="text-sm mb-2 inline-block">日期</label>
        <input type="date" id="f_date" class="input" required>
      </div>
      <div class="flex gap-3 mt-6">
        <button type="button" class="btn-secondary flex-1" onclick="closeModal()">取消</button>
        <button type="submit" class="btn-primary flex-1" id="saveBtn">儲存</button>
      </div>
    </form>
  </div>
</div>

<!-- Header -->
<div class="flex flex-wrap gap-3 items-center justify-between mb-8">
  <div>
    <h1 class="text-3xl font-black">送禮管理系統</h1>
    <p class="text-gray-500 text-sm mt-1">管理並追蹤你的送禮紀錄</p>
  </div>
  <div class="flex gap-2">
    <button class="btn-secondary" onclick="exportCSV()">📥 匯出 CSV</button>
    <button class="btn-primary" onclick="openAddModal()">＋ 新增送禮記錄</button>
  </div>
</div>

<!-- Stats Row -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
  <div class="card p-4 stat-card">
    <div class="stat-value" id="totalGifts">0</div>
    <div class="stat-label">總送禮筆數</div>
  </div>
  <div class="card p-4 stat-card">
    <div class="stat-value" id="latestGift">N/A</div>
    <div class="stat-label">最近一次送禮</div>
  </div>
</div>

<!-- Search & Filter -->
<div class="card p-4 mb-6">
  <div class="search-row">
    <input class="input" style="flex:1;min-width:180px;" id="searchInput" placeholder="🔍 搜尋..." oninput="filterData()">
    <button class="btn-secondary" onclick="clearFilters()">清除篩選</button>
  </div>
</div>

<!-- Data Table -->
<div class="card overflow-hidden">
  <div class="overflow-x-auto">
    <table style="width:100%;border-collapse:collapse;">
      <thead>
        <tr style="border-bottom:1px solid #1a1d35;">
          <th class="py-3 px-4 text-left font-medium text-sm text-gray-300">收件人</th>
          <th class="py-3 px-4 text-left font-medium text-sm text-gray-300">禮物</th>
          <th class="py-3 px-4 text-left font-medium text-sm text-gray-300">日期</th>
          <th style="padding:14px 16px;text-align:right;font-weight:600;font-size:13px;color:#888;">操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="emptyState" class="empty-state hidden">
      <div style="font-size:48px;margin-bottom:12px;">📭</div>
      <div class="font-bold text-lg">暫無資料</div>
      <div class="text-sm mt-2">點擊右上角「新增」開始使用</div>
    </div>
  </div>
  <div class="p-4 flex justify-between items-center" style="border-top:1px solid #1a1d35;">
    <div class="text-sm text-gray-500" id="countInfo">共 0 筆</div>
    <div class="flex gap-2" id="pagination"></div>
  </div>
</div>

<script>
const APP_CONFIG = {
  storageKey: 'send_gift_data',
  itemName: '送禮記錄',
  fields: [
    { name: 'recipient', label: '收件人', type: 'text', required: true },
    { name: 'gift', label: '禮物', type: 'text', required: true },
    { name: 'date', label: '日期', type: 'date', required: true }
  ],
  stats: [
    { id: 'totalGifts', calc: data => data.length },
    { id: 'latestGift', calc: data => data.length ? data[data.length - 1].date : 'N/A' }
  ],
  sampleData: [
    { recipient: '小明', gift: '巧克力', date: '2023-10-01' },
    { recipient: '小華', gift: '書籍', date: '2023-09-15' },
    { recipient: '小美', gift: '禮品卡', date: '2023-08-30' },
    { recipient: '大強', gift: '紀念品', date: '2023-07-22' },
    { recipient: '阿力', gift: '飲料券', date: '2023-06-12' }
  ]
};

let records = [];
let editId = null;
let confirmCallback = null;
let currentPage = 1;
const PAGE_SIZE = 15;

function load() {
  const stored = localStorage.getItem(APP_CONFIG.storageKey);
  records = stored ? JSON.parse(stored) : [];
  if (records.length === 0 && APP_CONFIG.sampleData.length > 0) {
    records = APP_CONFIG.sampleData.map((d, i) => ({...d, id: Date.now() + i, createdAt: new Date().toISOString()}));
    save();
  }
  render();
}

function save() {
  localStorage.setItem(APP_CONFIG.storageKey, JSON.stringify(records));
  updateStats();
}

function getFiltered() {
  const q = document.getElementById('searchInput')?.value.toLowerCase() || '';
  let result = records;
  if (q) {
    result = result.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(q)));
  }
  return result;
}

function render() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  const data = getFiltered();
  const pagination = document.getElementById('pagination');
  const emptyState = document.getElementById('emptyState');
  const countInfo = document.getElementById('countInfo');

  countInfo.textContent = `共 ${data.length} 筆`;
  emptyState.hidden = data.length !== 0;
  
  data.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE).forEach(record => {
    tbody.innerHTML += renderRow(record);
  });
  updateStats();
}

function renderRow(record) {
  return `
    <tr class="table-row">
      <td class="py-3 px-4">${record.recipient}</td>
      <td class="py-3 px-4">${record.gift}</td>
      <td class="py-3 px-4">${record.date}</td>
      <td class="py-3 px-4 text-right">
        <button class="btn-secondary mr-2" onclick="editRecord(${record.id})">編輯</button>
        <button class="btn-danger" onclick="confirmDelete(${record.id})">刪除</button>
      </td>
    </tr>`;
}

function updateStats() {
  APP_CONFIG.stats.forEach(stat => {
    document.getElementById(stat.id).textContent = stat.calc(records);
  });
}

function saveRecord(e) {
  e.preventDefault();
  const form = new FormData(e.target);
  const record = {};
  APP_CONFIG.fields.forEach(field => {
    record[field.name] = form.get(field.name);
  });
  record.id = editId !== null ? editId : Date.now();
  if (editId === null) {
    records.push(record);
  } else {
    const index = records.findIndex(r => r.id === editId);
    records[index] = {...record, id: editId};
  }
  closeModal();
  save();
  render();
  showToast('資料已儲存', true);
}

function showToast(message, success = true) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast show ' + (success ? 'success' : 'error');
  setTimeout(() => {
    toast.className = 'toast';
  }, 3000);
}

function openAddModal() {
  editId = null;
  document.getElementById('modalTitle').textContent = '新增送禮記錄';
  document.getElementById('dataForm').reset();
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
}

function clearFilters() {
  document.getElementById('searchInput').value = '';
  render();
}

function confirmDelete(id) {
  editId = id;
  confirmCallback = deleteRecord;
  document.getElementById('confirmOverlay').classList.remove('hidden');
}

function closeConfirm() {
  confirmCallback = null;
  document.getElementById('confirmOverlay').classList.add('hidden');
}

function deleteRecord() {
  if (confirmCallback && editId !== null) {
    records = records.filter(r => r.id !== editId);
    save();
    render();
    showToast('資料已刪除', true);
    closeConfirm();
  }
}

function editRecord(id) {
  editId = id;
  const record = records.find(r => r.id === id);
  if (record) {
    document.getElementById('f_recipient').value = record.recipient;
    document.getElementById('f_gift').value = record.gift;
    document.getElementById('f_date').value = record.date;
    document.getElementById('modalTitle').textContent = '編輯送禮記錄';
    document.getElementById('modalOverlay').classList.remove('hidden');
  }
}

function exportCSV() {
  let csvContent = "data:text/csv;charset=utf-8,收件人,禮物,日期\n";
  records.forEach(record => {
    csvContent += `${record.recipient},${record.gift},${record.date}\n`;
  });
  const encodedUri = encodeURI(csvContent);
  const link = document.createElement('a');
  link.setAttribute('href', encodedUri);
  link.setAttribute('download', '送禮記錄.csv');
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

document.addEventListener('DOMContentLoaded', () => {
  load();
});
</script>

</body>
</html>
