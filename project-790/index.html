<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: #f0f4f8;
            padding: 2.5rem 3rem;
        }
        .card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 1.5rem 2rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }
        .button {
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-block;
        }
        .button:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        .button:active {
            transform: scale(0.97);
        }
        .input {
            border: 1px solid #cbd5e1;
            border-radius: 0.5rem;
            padding: 0.75rem;
            width: 100%;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input:focus {
            border-color: #2563eb;
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.3);
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
    <title>記帳本</title>
</head>
<body class="fade-in">
    <header class="mb-8">
        <h1 class="text-4xl font-extrabold text-1e293b">記帳本</h1>
        <div class="mt-4 flex justify-between items-center">
            <div class="text-xl font-bold">總金額：<span id="total-amount">0</span> 元</div>
            <button id="clearAll" class="button">清空所有記錄</button>
        </div>
    </header>
    <main>
        <div class="card mb-12">
            <h2 class="text-2xl font-bold mb-4">新增記錄</h2>
            <div class="mb-4">
                <label for="description" class="block text-md font-bold mb-1">描述</label>
                <input type="text" id="description" class="input" placeholder="輸入記帳描述">
            </div>
            <div class="mb-4">
                <label for="amount" class="block text-md font-bold mb-1">金額</label>
                <input type="number" id="amount" class="input" placeholder="輸入金額">
            </div>
            <button id="addRecord" class="button">新增記錄</button>
        </div>
        <div id="records-section" class="mb-12">
            <h2 class="text-2xl font-bold mb-4">帳冊紀錄</h2>
            <div id="records-list" class="space-y-4">
                <!-- Records will be injected here -->
            </div>
            <div id="empty-state" class="text-gray-500" style="display: none;">暫無記錄，請新增記錄。</div>
        </div>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const descriptionInput = document.getElementById('description');
            const amountInput = document.getElementById('amount');
            const recordsList = document.getElementById('records-list');
            const emptyState = document.getElementById('empty-state');
            const totalAmountElem = document.getElementById('total-amount');
            const clearAllButton = document.getElementById('clearAll');

            const getRecords = () => JSON.parse(localStorage.getItem('records')) || [];
            const saveRecords = records => localStorage.setItem('records', JSON.stringify(records));

            const updateTotalAmount = () => {
                const records = getRecords();
                const totalAmount = records.reduce((total, record) => total + record.amount, 0);
                totalAmountElem.textContent = totalAmount;
            };

            const renderRecords = () => {
                recordsList.innerHTML = '';
                const records = getRecords();
                if (records.length === 0) {
                    emptyState.style.display = 'block';
                } else {
                    emptyState.style.display = 'none';
                    records.forEach(record => {
                        const recordElem = document.createElement('div');
                        recordElem.classList.add('flex', 'justify-between', 'items-center', 'card');
                        recordElem.innerHTML = `
                            <div>
                                <div class="text-lg font-bold">${record.description}</div>
                                <div class="text-gray-600">${record.date}</div>
                            </div>
                            <div class="text-lg font-bold">${record.amount} 元</div>
                        `;
                        recordsList.appendChild(recordElem);
                    });
                }
                updateTotalAmount();
            };

            document.getElementById('addRecord').addEventListener('click', () => {
                const description = descriptionInput.value.trim();
                const amount = parseFloat(amountInput.value.trim());
                if (description === '' || isNaN(amount)) {
                    alert('請輸入有效的描述和金額');
                    return;
                }
                const records = getRecords();
                records.push({
                    description,
                    amount,
                    date: new Date().toLocaleString('zh-TW', { dateStyle: 'medium', timeStyle: 'short' }),
                });
                saveRecords(records);
                descriptionInput.value = '';
                amountInput.value = '';
                renderRecords();
            });

            clearAllButton.addEventListener('click', () => {
                localStorage.removeItem('records');
                renderRecords();
            });

            renderRecords();
        });
    </script>
</body>
</html>
