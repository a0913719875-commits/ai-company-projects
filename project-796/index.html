<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股籌碼選股</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #07070f;
            color: #ffffff;
            font-family: 'Inter', system-ui, sans-serif;
            overflow-x: hidden;
        }
        .card {
            background-color: #0f1020;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
            border-radius: 16px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px rgba(0, 0, 0, 0.2);
        }
        .btn {
            background-color: #7c6cff;
            padding: 0.75rem 1.5rem;
            height: 44px;
            border-radius: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        .btn:active {
            transform: scale(0.97);
        }
        header {
            padding: 2.5rem 3rem;
        }
        main {
            padding: 2.5rem 3rem;
        }
        .input:focus {
            border-color: #7c6cff;
            box-shadow: 0 0 0 3px rgba(124, 108, 255, 0.3);
        }
        .fade-in {
            animation: fade-in 0.3s ease-out;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="fade-in">
<header class="flex justify-between items-center">
    <h1 class="text-4xl font-extrabold">台股籌碼選股</h1>
    <div class="flex space-x-4">
        <button class="btn">查看統計</button>
        <button class="btn">新增選股</button>
    </div>
</header>
<main>
    <section class="grid lg:grid-cols-3 gap-8">
        <div class="card p-6">
            <h2 class="text-xl font-bold">當沖操作</h2>
            <p class="mt-2 text-gray-400">透過籌碼分析進行每日當沖交易。</p>
            <button class="btn mt-4">開始當沖</button>
        </div>
        <div class="card p-6">
            <h2 class="text-xl font-bold">波段飆股</h2>
            <p class="mt-2 text-gray-400">分析潛在波段飆股以提升收益。</p>
            <button class="btn mt-4">查找飆股</button>
        </div>
        <div class="card p-6">
            <h2 class="text-xl font-bold">選股記錄</h2>
            <p class="mt-2 text-gray-400">查看過去選股記錄及其表現。</p>
            <button class="btn mt-4">查看記錄</button>
        </div>
    </section>
    <section class="mt-12">
        <!-- Placeholder for charts and statistical analysis -->
        <div id="empty-state" class="flex justify-center items-center h-64 text-gray-500">
            目前沒有數據顯示
        </div>
    </section>
</main>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (!localStorage.getItem('stocks')) {
            document.getElementById('empty-state').textContent = '目前沒有數據顯示';
        }
    });
</script>
</body>
</html>
