<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股籌碼選股</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: #07070f;
            color: #ffffff;
            padding: 2.5rem 3rem;
            margin: 0;
            animation: fadeIn 0.3s ease-out;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5rem;
        }
        h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0;
        }
        .stats {
            display: flex;
            gap: 1.5rem;
        }
        .stat {
            background-color: #0f1020;
            border-radius: 16px;
            padding: 1.5rem 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .stat:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }
        .buttons {
            display: flex;
            gap: 0.75rem;
        }
        button {
            background-color: #7c6cff;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            cursor: pointer;
            padding: 0.75rem 1.5rem;
            height: 44px;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        button:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        button:active {
            transform: scale(0.97);
        }
        main {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 3rem;
        }
        .card {
            background-color: #0f1020;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }
        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .card-description {
            font-size: 1rem;
            line-height: 1.7;
            font-weight: 400;
            margin-bottom: 1.5rem;
        }
        .empty-state {
            text-align: center;
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.7);
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <header>
        <h1>台股籌碼選股</h1>
        <div class="stats">
            <div class="stat">統計數字 1</div>
            <div class="stat">統計數字 2</div>
        </div>
        <div class="buttons">
            <button>股票當沖</button>
            <button>波段飆股</button>
        </div>
    </header>
    <main id="content">
        <div class="card">
            <div class="card-title">股票當沖</div>
            <div class="card-description">說明文字...</div>
            <button>操作</button>
        </div>
        <div class="card">
            <div class="card-title">波段飆股</div>
            <div class="card-description">說明文字...</div>
            <button>操作</button>
        </div>
    </main>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const content = document.getElementById('content');
            if (!localStorage.getItem('data')) {
                const emptyState = document.createElement('div');
                emptyState.className = 'empty-state';
                emptyState.textContent = '目前沒有資料，請新增一些選股策略。';
                content.appendChild(emptyState);
            }
        });
    </script>
</body>
</html>
