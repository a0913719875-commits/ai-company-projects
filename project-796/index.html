<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台股籌碼選股</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Inter',sans-serif;background:#07070f;color:#fff;min-height:100vh;}
    .card{background:#0f1020;border:1px solid #1a1d35;border-radius:14px;}
    .btn{background:linear-gradient(135deg,#7c6cff,#00d4ff);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-weight:700;cursor:pointer;transition:all .2s;}
    .btn:hover{opacity:.9;transform:translateY(-1px);}
    .btn-sm{padding:6px 14px;font-size:13px;font-weight:600;border-radius:8px;border:none;cursor:pointer;transition:all .2s;}
    .btn-secondary{background:transparent;color:#7c6cff;border:1px solid #7c6cff44;border-radius:10px;padding:8px 16px;font-weight:600;cursor:pointer;}
    .btn-danger{background:#dc262622;color:#dc2626;border:1px solid #dc262633;}
    .input,.select{background:#0f1020;border:1px solid #1a1d35;border-radius:10px;padding:10px 14px;color:#fff;width:100%;font-size:14px;outline:none;transition:border .2s;}
    .input:focus,.select:focus{border-color:#7c6cff;box-shadow:0 0 0 3px #7c6cff22;}
    .modal{position:fixed;inset:0;background:#00000088;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
    .modal-box{background:#0f1020;border-radius:18px;width:100%;max-width:540px;padding:28px;border:1px solid #1a1d35;max-height:90vh;overflow-y:auto;}
    .toast{position:fixed;bottom:24px;right:24px;background:#1a1a2e;border:1px solid #7c6cff44;border-radius:12px;padding:14px 20px;color:#fff;font-size:14px;z-index:100;transform:translateY(100px);transition:transform .3s;}
    .toast.show{transform:translateY(0);}
    tr.row:hover{background:#7c6cff08;}
    tr.row td{padding:12px 14px;border-bottom:1px solid #1a1d3522;font-size:13px;}
    th{padding:12px 14px;font-size:12px;font-weight:700;color:#888;text-align:left;}
    .pos{color:#00ff88;font-weight:700;}
    .neg{color:#ff4466;font-weight:700;}
    .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
    .badge-buy{background:#00ff8822;color:#00ff88;border:1px solid #00ff8844;}
    .badge-sell{background:#ff446622;color:#ff4466;border:1px solid #ff446644;}
    .badge-wave{background:#7c6cff22;color:#7c6cff;border:1px solid #7c6cff44;}
    .badge-daytrade{background:#ffd70022;color:#ffd700;border:1px solid #ffd70044;}
    .confirm{position:fixed;inset:0;background:#00000088;display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;}
    .confirm-box{background:#0f1020;border-radius:16px;max-width:340px;width:100%;padding:24px;border:1px solid #1a1d35;text-align:center;}
  </style>
</head>
<body class="p-4 md:p-6">

<div id="toast" class="toast"></div>

<!-- Confirm -->
<div id="conf" class="confirm hidden">
  <div class="confirm-box">
    <div class="text-lg font-bold mb-2">確認刪除</div>
    <div class="text-sm text-gray-400 mb-6">此操作無法復原</div>
    <div class="flex gap-3 justify-center">
      <button class="btn-secondary btn-sm" onclick="document.getElementById('conf').classList.add('hidden')">取消</button>
      <button class="btn-sm btn-danger" id="confOk" style="padding:8px 20px;">確定刪除</button>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="flex justify-between items-center mb-5">
      <h2 class="text-xl font-bold" id="modalTitle">新增選股</h2>
      <button onclick="closeModal()" style="background:none;border:none;color:#888;font-size:22px;cursor:pointer;">✕</button>
    </div>
    <form id="form" onsubmit="saveRecord(event)">
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div><label class="block text-xs font-bold mb-1 text-gray-400">股票代碼 *</label>
          <input id="f_code" class="input" placeholder="如 2330" required></div>
        <div><label class="block text-xs font-bold mb-1 text-gray-400">股票名稱 *</label>
          <input id="f_name" class="input" placeholder="如 台積電" required></div>
      </div>
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div><label class="block text-xs font-bold mb-1 text-gray-400">收盤價 (元) *</label>
          <input id="f_price" class="input" type="number" step="0.01" placeholder="如 950.00" required></div>
        <div><label class="block text-xs font-bold mb-1 text-gray-400">漲跌幅 (%)</label>
          <input id="f_change" class="input" type="number" step="0.01" placeholder="如 2.35"></div>
      </div>
      <div class="grid grid-cols-3 gap-3 mb-3">
        <div><label class="block text-xs font-bold mb-1 text-gray-400">外資買賣超 (張) *</label>
          <input id="f_foreign" class="input" type="number" placeholder="正=買超" required></div>
        <div><label class="block text-xs font-bold mb-1 text-gray-400">投信買賣超 (張)</label>
          <input id="f_trust" class="input" type="number" placeholder="正=買超"></div>
        <div><label class="block text-xs font-bold mb-1 text-gray-400">自營商買賣超 (張)</label>
          <input id="f_dealer" class="input" type="number" placeholder="正=買超"></div>
      </div>
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div><label class="block text-xs font-bold mb-1 text-gray-400">成交量 (千張)</label>
          <input id="f_volume" class="input" type="number" placeholder="如 45.2"></div>
        <div><label class="block text-xs font-bold mb-1 text-gray-400">選股策略 *</label>
          <select id="f_strategy" class="select" required>
            <option value="">請選擇</option>
            <option value="當沖">📈 當沖</option>
            <option value="波段">🚀 波段</option>
            <option value="長期">💎 長期持有</option>
          </select></div>
      </div>
      <div class="mb-3"><label class="block text-xs font-bold mb-1 text-gray-400">備註</label>
        <input id="f_note" class="input" placeholder="選股理由或觀察重點"></div>
      <div class="mb-4"><label class="block text-xs font-bold mb-1 text-gray-400">日期</label>
        <input id="f_date" class="input" type="date"></div>
      <div class="flex gap-3">
        <button type="button" class="btn-secondary flex-1" onclick="closeModal()">取消</button>
        <button type="submit" class="btn flex-1" id="saveBtn">儲存</button>
      </div>
    </form>
  </div>
</div>

<!-- Header -->
<div class="flex flex-wrap gap-3 items-start justify-between mb-6">
  <div>
    <h1 class="text-3xl font-black">台股籌碼選股 📊</h1>
    <p class="text-gray-500 text-sm mt-1">追蹤三大法人籌碼動向，掌握主力動態</p>
  </div>
  <div class="flex gap-2 flex-wrap">
    <button class="btn-secondary btn-sm" onclick="exportCSV()">📥 匯出 CSV</button>
    <button class="btn btn-sm" onclick="openAdd()">＋ 新增選股</button>
  </div>
</div>

<!-- Stats -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
  <div class="card p-4 text-center">
    <div class="text-2xl font-black text-purple-400" id="statTotal">0</div>
    <div class="text-xs text-gray-500 mt-1">追蹤股票</div>
  </div>
  <div class="card p-4 text-center">
    <div class="text-2xl font-black text-green-400" id="statForeignBuy">0</div>
    <div class="text-xs text-gray-500 mt-1">外資買超股</div>
  </div>
  <div class="card p-4 text-center">
    <div class="text-2xl font-black text-yellow-400" id="statAvgChange">0%</div>
    <div class="text-xs text-gray-500 mt-1">平均漲跌幅</div>
  </div>
  <div class="card p-4 text-center">
    <div class="text-2xl font-black text-blue-400" id="stat3buy">0</div>
    <div class="text-xs text-gray-500 mt-1">三大法人齊買</div>
  </div>
</div>

<!-- Filter -->
<div class="card p-4 mb-5">
  <div class="flex flex-wrap gap-3 items-center">
    <input id="search" class="input" style="flex:1;min-width:160px;" placeholder="🔍 搜尋代碼/名稱..." oninput="render()">
    <select id="fStrategy" class="select" style="width:140px;" onchange="render()">
      <option value="">所有策略</option>
      <option value="當沖">當沖</option>
      <option value="波段">波段</option>
      <option value="長期">長期持有</option>
    </select>
    <select id="fForeign" class="select" style="width:140px;" onchange="render()">
      <option value="">外資不限</option>
      <option value="buy">外資買超</option>
      <option value="sell">外資賣超</option>
    </select>
    <select id="fSort" class="select" style="width:160px;" onchange="render()">
      <option value="date">日期（新→舊）</option>
      <option value="foreign">外資買超（多→少）</option>
      <option value="change">漲幅（高→低）</option>
      <option value="score">籌碼得分（高→低）</option>
    </select>
    <button class="btn-secondary btn-sm" onclick="clearFilter()">清除</button>
  </div>
</div>

<!-- Table -->
<div class="card overflow-hidden mb-4">
  <div class="overflow-x-auto">
    <table style="width:100%;border-collapse:collapse;">
      <thead style="background:#0a0b18;">
        <tr>
          <th>代碼/名稱</th>
          <th>收盤價</th>
          <th>漲跌幅</th>
          <th>外資(張)</th>
          <th>投信(張)</th>
          <th>自營(張)</th>
          <th>三大合計</th>
          <th>籌碼分</th>
          <th>策略</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="empty" class="hidden" style="text-align:center;padding:60px;color:#555;">
      <div style="font-size:48px;margin-bottom:12px;">📭</div>
      <div class="font-bold text-lg">暫無資料</div>
      <div class="text-sm mt-2">點擊右上角「新增選股」開始追蹤</div>
    </div>
  </div>
  <div class="p-4 flex justify-between text-sm text-gray-500" style="border-top:1px solid #1a1d35;">
    <span id="countInfo">共 0 筆</span>
    <span>籌碼分 = 外資×0.5 + 投信×0.3 + 自營×0.2 (每百張換算)</span>
  </div>
</div>

<script>
const KEY = 'tw_stock_chips_v2';
let records = [];
let editId = null;

const SAMPLE = [
  {id:1,code:'2330',name:'台積電',price:950,change:2.35,foreign:15420,trust:3200,dealer:-890,volume:52.3,strategy:'波段',note:'AI需求強勁，外資連續買超',date:'2026-06-01'},
  {id:2,code:'2454',name:'聯發科',price:1250,change:3.8,foreign:8760,trust:1580,dealer:320,volume:38.7,strategy:'波段',note:'AI PC需求回升',date:'2026-06-01'},
  {id:3,code:'2317',name:'鴻海',price:185,change:1.5,foreign:22000,trust:-500,dealer:1200,volume:88.2,strategy:'當沖',note:'AI伺服器組裝量增',date:'2026-06-01'},
  {id:4,code:'6505',name:'台塑化',price:95,change:-0.5,foreign:-3200,trust:800,dealer:-200,volume:12.1,strategy:'長期',note:'觀察原油走勢',date:'2026-06-01'},
  {id:5,code:'2412',name:'中華電',price:128,change:0.3,foreign:4500,trust:1200,dealer:300,volume:5.8,strategy:'長期',note:'電信防禦股，穩定配息',date:'2026-06-01'},
  {id:6,code:'3711',name:'日月光投控',price:165,change:4.2,foreign:9800,trust:2100,dealer:680,volume:28.4,strategy:'波段',note:'AI封裝需求爆炸成長',date:'2026-06-01'},
];

function score(r){ return Math.round((r.foreign*0.5 + r.trust*0.3 + r.dealer*0.2)/100); }

function load(){
  const s = localStorage.getItem(KEY);
  records = s ? JSON.parse(s) : [];
  if(!records.length){ records = SAMPLE.map(d=>({...d})); save(); }
  render();
}

function save(){
  localStorage.setItem(KEY, JSON.stringify(records));
  updateStats();
}

function getFiltered(){
  const q = document.getElementById('search').value.toLowerCase();
  const strat = document.getElementById('fStrategy').value;
  const ffor = document.getElementById('fForeign').value;
  const sortBy = document.getElementById('fSort').value;

  let list = records.filter(r=>{
    if(q && !r.code.includes(q) && !r.name.includes(q)) return false;
    if(strat && r.strategy !== strat) return false;
    if(ffor === 'buy' && r.foreign <= 0) return false;
    if(ffor === 'sell' && r.foreign >= 0) return false;
    return true;
  });

  if(sortBy === 'foreign') list.sort((a,b)=>b.foreign-a.foreign);
  else if(sortBy === 'change') list.sort((a,b)=>b.change-a.change);
  else if(sortBy === 'score') list.sort((a,b)=>score(b)-score(a));
  else list.sort((a,b)=>new Date(b.date)-new Date(a.date));

  return list;
}

function render(){
  const list = getFiltered();
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  if(!list.length){
    document.getElementById('empty').classList.remove('hidden');
  } else {
    document.getElementById('empty').classList.add('hidden');
    list.forEach(r=>{
      const sc = score(r);
      const scColor = sc>50?'#00ff88':sc>0?'#7c6cff':sc<-30?'#ff4466':'#888';
      const stratBadge = r.strategy==='當沖'?'badge-daytrade':r.strategy==='波段'?'badge-wave':'badge-buy';
      const total = r.foreign + r.trust + r.dealer;
      const tr = document.createElement('tr');
      tr.className = 'row';
      tr.innerHTML = `
        <td><div class="font-bold">${r.code}</div><div class="text-xs text-gray-500">${r.name}</div></td>
        <td><div class="font-bold">$${r.price.toLocaleString()}</div></td>
        <td><div class="${r.change>=0?'pos':'neg'}">${r.change>=0?'+':''}${r.change}%</div></td>
        <td><div class="${r.foreign>=0?'pos':'neg'}">${r.foreign>=0?'+':''}${r.foreign.toLocaleString()}</div></td>
        <td><div class="${r.trust>=0?'pos':'neg'}">${r.trust>=0?'+':''}${r.trust.toLocaleString()}</div></td>
        <td><div class="${r.dealer>=0?'pos':'neg'}">${r.dealer>=0?'+':''}${r.dealer.toLocaleString()}</div></td>
        <td><div class="${total>=0?'pos':'neg'}" style="font-weight:700;">${total>=0?'+':''}${total.toLocaleString()}</div></td>
        <td><div style="font-weight:800;color:${scColor};">${sc>0?'+':''}${sc}</div></td>
        <td><span class="badge ${stratBadge}">${r.strategy}</span></td>
        <td>
          <button class="btn-sm btn-secondary" style="margin-right:6px;" onclick="openEdit('${r.id}')">編輯</button>
          <button class="btn-sm btn-danger" onclick="del('${r.id}')">刪除</button>
        </td>`;
      tbody.appendChild(tr);
    });
  }
  document.getElementById('countInfo').textContent = `共 ${list.length} 筆`;
  updateStats();
}

function updateStats(){
  const list = records;
  document.getElementById('statTotal').textContent = list.length;
  document.getElementById('statForeignBuy').textContent = list.filter(r=>r.foreign>0).length;
  const avgChange = list.length ? (list.reduce((s,r)=>s+r.change,0)/list.length).toFixed(1) : 0;
  document.getElementById('statAvgChange').textContent = (avgChange>=0?'+':'')+avgChange+'%';
  const s3 = list.filter(r=>r.foreign>0&&r.trust>0&&r.dealer>0).length;
  document.getElementById('stat3buy').textContent = s3;
}

function openAdd(){
  editId=null;
  document.getElementById('modalTitle').textContent='新增選股';
  document.getElementById('saveBtn').textContent='新增';
  document.getElementById('form').reset();
  document.getElementById('f_date').value = new Date().toISOString().slice(0,10);
  document.getElementById('modal').classList.remove('hidden');
}

function openEdit(id){
  editId=id;
  const r=records.find(x=>String(x.id)===String(id));
  if(!r)return;
  document.getElementById('modalTitle').textContent='編輯選股';
  document.getElementById('saveBtn').textContent='儲存';
  ['code','name','price','change','foreign','trust','dealer','volume','strategy','note','date'].forEach(k=>{
    const el=document.getElementById('f_'+k);
    if(el)el.value=r[k]??'';
  });
  document.getElementById('modal').classList.remove('hidden');
}

function closeModal(){ document.getElementById('modal').classList.add('hidden'); }

function saveRecord(e){
  e.preventDefault();
  const get = id => { const el=document.getElementById('f_'+id); return el?el.value.trim():''; };
  const toNum = v => parseFloat(v)||0;

  if(!get('code')||!get('name')||!get('strategy')){
    toast('請填寫必填欄位','error'); return;
  }

  const data = {
    code:get('code'), name:get('name'),
    price:toNum(get('price')), change:toNum(get('change')),
    foreign:toNum(get('foreign')), trust:toNum(get('trust')), dealer:toNum(get('dealer')),
    volume:toNum(get('volume')), strategy:get('strategy'),
    note:get('note'), date:get('date')||new Date().toISOString().slice(0,10)
  };

  if(editId){
    const i=records.findIndex(x=>String(x.id)===String(editId));
    if(i>=0)records[i]={...records[i],...data};
    toast('已更新');
  } else {
    records.unshift({...data,id:Date.now()});
    toast('已新增');
  }
  save(); render(); closeModal();
}

function del(id){
  document.getElementById('conf').classList.remove('hidden');
  document.getElementById('confOk').onclick=()=>{
    records=records.filter(x=>String(x.id)!==String(id));
    save(); render();
    document.getElementById('conf').classList.add('hidden');
    toast('已刪除');
  };
}

function clearFilter(){
  document.getElementById('search').value='';
  document.getElementById('fStrategy').value='';
  document.getElementById('fForeign').value='';
  document.getElementById('fSort').value='date';
  render();
}

function exportCSV(){
  const list=getFiltered();
  if(!list.length){toast('沒有資料','error');return;}
  const headers=['代碼','名稱','收盤價','漲跌幅%','外資(張)','投信(張)','自營(張)','三大合計','成交量K','策略','備註','日期'];
  const rows=list.map(r=>[r.code,r.name,r.price,r.change,r.foreign,r.trust,r.dealer,r.foreign+r.trust+r.dealer,r.volume,r.strategy,r.note,r.date].map(v=>`"${String(v||'').replace(/"/g,'""')}"`));
  const csv=[headers.join(','),...rows.map(r=>r.join(','))].join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='台股籌碼選股_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();URL.revokeObjectURL(url);
  toast('CSV 匯出成功');
}

function toast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=(type==='success'?'✅ ':'❌ ')+msg;
  t.style.borderLeft=type==='success'?'3px solid #00ff88':'3px solid #ff4466';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

load();
</script>
</body>
</html>
