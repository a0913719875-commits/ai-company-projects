<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統事件追蹤器 - 事件日誌管理</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // Enable dark mode based on 'dark' class on html tag
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1', // Indigo 500
                        secondary: '#a78bfa', // Violet 400
                        accent: '#ec4899', // Pink 500
                        darkbg: '#1a202c', // Dark gray for background
                        darkcard: '#2d3748', // Slightly lighter dark gray for cards
                        darktext: '#e2e8f0', // Light gray for text
                        darkborder: '#4a5568', // Gray for borders
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #2d3748; /* darkcard */
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a5568; /* darkborder */
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6366f1; /* primary */
        }

        /* Basic form validation styling */
        input:invalid, select:invalid, textarea:invalid {
            border-color: #ef4444; /* red-500 */
        }
    </style>
</head>
<body class="bg-darkbg text-darktext font-sans antialiased min-h-screen flex flex-col">

    <div class="container mx-auto p-4 sm:p-6 lg:p-8 flex-grow">
        <!-- Header -->
        <header class="flex flex-col sm:flex-row items-center justify-between mb-8 pb-4 border-b border-darkborder">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-primary mb-4 sm:mb-0">
                <span class="block text-2xl sm:text-3xl text-darktext mb-1">系統事件追蹤器</span>
                事件日誌管理
            </h1>
            <button id="addEventBtn" class="bg-primary hover:bg-indigo-600 text-white font-bold py-2 px-6 rounded-lg shadow-lg transition duration-300 ease-in-out transform hover:scale-105">
                + 新增事件
            </button>
        </header>

        <!-- Control Panel: Search & Statistics -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Search Bar -->
            <div class="md:col-span-2">
                <label for="search" class="block text-sm font-medium text-darktext mb-2">搜尋事件</label>
                <div class="relative">
                    <input type="text" id="search" placeholder="輸入關鍵字搜尋 (事件類型, 來源, 詳情...)"
                           class="w-full p-3 pl-10 bg-darkcard border border-darkborder rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-darktext placeholder-gray-400">
                    <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>
            </div>

            <!-- Statistics -->
            <div class="md:col-span-1 bg-darkcard p-4 rounded-lg shadow-md border border-darkborder">
                <h3 class="text-lg font-semibold text-darktext mb-3">統計概覽</h3>
                <div class="grid grid-cols-2 gap-4 text-sm">
                    <div>
                        <p class="text-gray-400">總事件數:</p>
                        <p id="totalEvents" class="text-xl font-bold text-primary">0</p>
                    </div>
                    <div>
                        <p class="text-gray-400">成功事件:</p>
                        <p id="successfulEvents" class="text-xl font-bold text-green-400">0</p>
                    </div>
                    <div>
                        <p class="text-gray-400">失敗事件:</p>
                        <p id="failedEvents" class="text-xl font-bold text-red-400">0</p>
                    </div>
                    <div>
                        <p class="text-gray-400">處理中事件:</p>
                        <p id="pendingEvents" class="text-xl font-bold text-yellow-400">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Event List/Table -->
        <h2 class="text-2xl font-bold text-darktext mb-4">事件日誌</h2>
        <div class="bg-darkcard rounded-lg shadow-md overflow-hidden border border-darkborder">
            <!-- Desktop Table View -->
            <div class="hidden md:block">
                <table class="min-w-full divide-y divide-darkborder">
                    <thead class="bg-darkcard">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">事件ID</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">事件類型</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">時間戳</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">狀態</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">來源</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">詳情</th>
                            <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-400 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody id="eventTableBody" class="divide-y divide-darkborder">
                        <!-- Event rows will be injected here -->
                    </tbody>
                </table>
            </div>

            <!-- Mobile List View -->
            <div id="eventListMobile" class="md:hidden divide-y divide-darkborder">
                <!-- Event cards will be injected here -->
            </div>
            <p id="noEventsMessage" class="hidden p-6 text-center text-gray-400">目前沒有事件日誌。</p>
        </div>
    </div>

    <!-- Add/Edit Event Modal -->
    <div id="eventModal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-darkcard rounded-lg shadow-xl w-full max-w-lg p-6 border border-darkborder relative">
            <h3 id="modalTitle" class="text-2xl font-bold text-primary mb-6">新增事件</h3>
            <form id="eventForm" class="space-y-4">
                <div>
                    <label for="eventType" class="block text-sm font-medium text-darktext mb-1">事件類型 <span class="text-red-500">*</span></label>
                    <input type="text" id="eventType" required placeholder="例如: 使用者登入, API請求失敗"
                           class="w-full p-2 bg-darkbg border border-darkborder rounded-md focus:outline-none focus:ring-1 focus:ring-primary text-darktext placeholder-gray-500">
                </div>
                <div>
                    <label for="status" class="block text-sm font-medium text-darktext mb-1">狀態 <span class="text-red-500">*</span></label>
                    <select id="status" required
                            class="w-full p-2 bg-darkbg border border-darkborder rounded-md focus:outline-none focus:ring-1 focus:ring-primary text-darktext">
                        <option value="">請選擇狀態</option>
                        <option value="成功">成功</option>
                        <option value="失敗">失敗</option>
                        <option value="警告">警告</option>
                        <option value="處理中">處理中</option>
                    </select>
                </div>
                <div>
                    <label for="source" class="block text-sm font-medium text-darktext mb-1">來源 <span class="text-red-500">*</span></label>
                    <input type="text" id="source" required placeholder="例如: Web前端, 後端服務器A"
                           class="w-full p-2 bg-darkbg border border-darkborder rounded-md focus:outline-none focus:ring-1 focus:ring-primary text-darktext placeholder-gray-500">
                </div>
                <div>
                    <label for="details" class="block text-sm font-medium text-darktext mb-1">詳情</label>
                    <textarea id="details" rows="3" placeholder="提供事件的詳細描述..."
                              class="w-full p-2 bg-darkbg border border-darkborder rounded-md focus:outline-none focus:ring-1 focus:ring-primary text-darktext placeholder-gray-500"></textarea>
                </div>
                <div class="flex justify-end space-x-4 pt-4">
                    <button type="button" id="cancelModalBtn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg transition duration-300">
                        取消
                    </button>
                    <button type="submit" class="bg-primary hover:bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg transition duration-300">
                        儲存
                    </button>
                </div>
            </form>
            <button id="closeModalBtn" class="absolute top-4 right-4 text-gray-400 hover:text-darktext transition duration-300">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
    </div>

    <footer class="mt-8 py-4 text-center text-gray-500 text-sm border-t border-darkborder">
        © 2023 系統事件追蹤器. 保留所有權利.
    </footer>

    <script>
        const STORAGE_KEY = 'eventTrackerData';
        let events = [];
        let currentEditId = null; // To track which event is being edited

        const eventTableBody = document.getElementById('eventTableBody');
        const eventListMobile = document.getElementById('eventListMobile');
        const noEventsMessage = document.getElementById('noEventsMessage');
        const addEventBtn = document.getElementById('addEventBtn');
        const eventModal = document.getElementById('eventModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const eventForm = document.getElementById('eventForm');
        const modalTitle = document.getElementById('modalTitle');
        const searchInput = document.getElementById('search');

        // Form fields
        const eventTypeInput = document.getElementById('eventType');
        const statusSelect = document.getElementById('status');
        const sourceInput = document.getElementById('source');
        const detailsTextarea = document.getElementById('details');

        // Statistics elements
        const totalEventsElem = document.getElementById('totalEvents');
        const successfulEventsElem = document.getElementById('successfulEvents');
        const failedEventsElem = document.getElementById('failedEvents');
        const pendingEventsElem = document.getElementById('pendingEvents');

        // Utility function to generate unique ID
        function generateId() {
            return 'evt_' + Math.random().toString(36).substr(2, 9);
        }

        // Format timestamp
        function formatTimestamp(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('zh-Hant', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false // Use 24-hour format
            });
        }

        // Load data from localStorage or use demo data
        function loadEvents() {
            const storedData = localStorage.getItem(STORAGE_KEY);
            if (storedData) {
                events = JSON.parse(storedData);
            } else {
                // Demo Data (5+ records)
                events = [
                    {
                        id: generateId(),
                        eventType: '使用者登入',
                        timestamp: new Date(Date.now() - 3600 * 1000 * 5).toISOString(),
                        status: '成功',
                        source: 'Web前端',
                        details: '使用者 admin 成功登入系統。'
                    },
                    {
                        id: generateId(),
                        eventType: 'API請求失敗',
                        timestamp: new Date(Date.now() - 3600 * 1000 * 2).toISOString(),
                        status: '失敗',
                        source: '後端服務器A',
                        details: '請求 /api/data 失敗，錯誤碼 500。'
                    },
                    {
                        id: generateId(),
                        eventType: '數據庫備份',
                        timestamp: new Date(Date.now() - 3600 * 1000 * 1).toISOString(),
                        status: '處理中',
                        source: '數據庫服務器B',
                        details: '每日數據庫備份正在進行中。'
                    },
                    {
                        id: generateId(),
                        eventType: '配置更新',
                        timestamp: new Date(Date.now() - 3600 * 1000 * 0.5).toISOString(),
                        status: '成功',
                        source: '管理後台',
                        details: '系統配置已由 superuser 更新。'
                    },
                    {
                        id: generateId(),
                        eventType: '資源耗盡警告',
                        timestamp: new Date(Date.now() - 3600 * 1000 * 0.2).toISOString(),
                        status: '警告',
                        source: '伺服器監控',
                        details: '伺服器C記憶體使用率達到 90%。'
                    },
                    {
                        id: generateId(),
                        eventType: '使用者註冊',
                        timestamp: new Date(Date.now() - 3600 * 1000 * 8).toISOString(),
                        status: '成功',
                        source: '註冊服務',
                        details: '新使用者 user_001 成功註冊。'
                    },
                    {
                        id: generateId(),
                        eventType: '定時任務失敗',
                        timestamp: new Date(Date.now() - 3600 * 1000 * 0.1).toISOString(),
                        status: '失敗',
                        source: '排程器',
                        details: '每日報告生成任務執行失敗。'
                    }
                ];
                saveEvents();
            }
        }

        // Save data to localStorage
        function saveEvents() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
        }

        // Render events to the table and mobile list
        function renderEvents(filterText = '') {
            eventTableBody.innerHTML = '';
            eventListMobile.innerHTML = '';
            const filteredEvents = events.filter(event =>
                event.eventType.toLowerCase().includes(filterText.toLowerCase()) ||
                event.status.toLowerCase().includes(filterText.toLowerCase()) ||
                event.source.toLowerCase().includes(filterText.toLowerCase()) ||
                event.details.toLowerCase().includes(filterText.toLowerCase()) ||
                event.id.toLowerCase().includes(filterText.toLowerCase())
            ).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)); // Sort by newest first

            if (filteredEvents.length === 0) {
                noEventsMessage.classList.remove('hidden');
            } else {
                noEventsMessage.classList.add('hidden');
            }

            filteredEvents.forEach(event => {
                const statusColorClass = {
                    '成功': 'text-green-400',
                    '失敗': 'text-red-400',
                    '警告': 'text-yellow-400',
                    '處理中': 'text-blue-400'
                }[event.status] || 'text-gray-400';

                // Desktop Table Row
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-darkbg transition duration-150 ease-in-out';
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-darktext">${event.id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-darktext">${event.eventType}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-400">${formatTimestamp(event.timestamp)}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm ${statusColorClass}">${event.status}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-darktext">${event.source}</td>
                    <td class="px-6 py-4 text-sm text-gray-400 max-w-xs truncate" title="${event.details}">${event.details || '無'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button data-id="${event.id}" class="edit-btn text-primary hover:text-indigo-400 mr-3 transition duration-150">編輯</button>
                        <button data-id="${event.id}" class="delete-btn text-red-500 hover:text-red-400 transition duration-150">刪除</button>
                    </td>
                `;
                eventTableBody.appendChild(tr);

                // Mobile List Card
                const div = document.createElement('div');
                div.className = 'p-4 border-b border-darkborder last:border-b-0 bg-darkcard';
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-semibold text-gray-400">${event.id}</span>
                        <div class="flex">
                            <button data-id="${event.id}" class="edit-btn text-primary hover:text-indigo-400 text-sm mr-3 transition duration-150">編輯</button>
                            <button data-id="${event.id}" class="delete-btn text-red-500 hover:text-red-400 text-sm transition duration-150">刪除</button>
                        </div>
                    </div>
                    <p class="text-lg font-bold text-darktext mb-1">${event.eventType} <span class="text-sm ${statusColorClass}">(${event.status})</span></p>
                    <p class="text-sm text-gray-400 mb-1">來源: ${event.source}</p>
                    <p class="text-sm text-gray-500 mb-2">時間: ${formatTimestamp(event.timestamp)}</p>
                    <p class="text-sm text-darktext">${event.details || '無詳情'}</p>
                `;
                eventListMobile.appendChild(div);
            });

            attachEventHandlers();
            updateStatistics();
        }

        // Attach event listeners for edit/delete buttons
        function attachEventHandlers() {
            document.querySelectorAll('.edit-btn').forEach(button => {
                button.onclick = (e) => openModalForEdit(e.target.dataset.id);
            });
            document.querySelectorAll('.delete-btn').forEach(button => {
                button.onclick = (e) => deleteEvent(e.target.dataset.id);
            });
        }

        // Update statistics display
        function updateStatistics() {
            totalEventsElem.textContent = events.length;
            successfulEventsElem.textContent = events.filter(e => e.status === '成功').length;
            failedEventsElem.textContent = events.filter(e => e.status === '失敗').length;
            pendingEventsElem.textContent = events.filter(e => e.status === '處理中').length;
        }

        // Open modal for adding a new event
        addEventBtn.addEventListener('click', () => {
            currentEditId = null;
            modalTitle.textContent = '新增事件';
            eventForm.reset();
            eventModal.classList.remove('hidden');
        });

        // Open modal for editing an existing event
        function openModalForEdit(id) {
            currentEditId = id;
            modalTitle.textContent = '編輯事件';
            const eventToEdit = events.find(e => e.id === id);
            if (eventToEdit) {
                eventTypeInput.value = eventToEdit.eventType;
                statusSelect.value = eventToEdit.status;
                sourceInput.value = eventToEdit.source;
                detailsTextarea.value = eventToEdit.details;
                eventModal.classList.remove('hidden');
            }
        }

        // Close modal
        closeModalBtn.addEventListener('click', () => {
            eventModal.classList.add('hidden');
            eventForm.reset();
            currentEditId = null;
        });
        cancelModalBtn.addEventListener('click', () => {
            eventModal.classList.add('hidden');
            eventForm.reset();
            currentEditId = null;
        });

        // Handle form submission (add/edit)
        eventForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const newEventData = {
                eventType: eventTypeInput.value.trim(),
                status: statusSelect.value,
                source: sourceInput.value.trim(),
                details: detailsTextarea.value.trim(),
            };

            if (currentEditId) {
                // Edit existing event
                const index = events.findIndex(e => e.id === currentEditId);
                if (index !== -1) {
                    events[index] = { ...events[index], ...newEventData };
                }
            } else {
                // Add new event
                const newEvent = {
                    id: generateId(),
                    timestamp: new Date().toISOString(), // Use current timestamp for new events
                    ...newEventData
                };
                events.push(newEvent);
            }

            saveEvents();
            renderEvents(searchInput.value); // Re-render with current search filter
            eventModal.classList.add('hidden');
            eventForm.reset();
            currentEditId = null;
        });

        // Delete event
        function deleteEvent(id) {
            if (confirm('您確定要刪除此事件嗎？此操作無法復原。')) {
                events = events.filter(e => e.id !== id);
                saveEvents();
                renderEvents(searchInput.value); // Re-render with current search filter
            }
        }

        // Search functionality
        searchInput.addEventListener('input', () => {
            renderEvents(searchInput.value);
        });

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            loadEvents();
            renderEvents();
        });

    </script>
</body>
</html>
